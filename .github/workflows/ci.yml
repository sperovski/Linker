name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Linker.slnx

      - name: Build
        run: dotnet build Linker.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test Linker.Application.Tests/Linker.Application.Tests.csproj --no-build --configuration Release

      # Testcontainers spins up throwaway Postgres containers using the
      # runner's built-in Docker daemon.
      - name: Integration tests
        run: dotnet test Linker.Api.IntegrationTests/Linker.Api.IntegrationTests.csproj --no-build --configuration Release

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Production build
        run: npx ng build --configuration production

  images:
    name: Publish Docker images
    # Only after both build jobs pass, and only for commits on main.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Linker.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/linker-api:latest
            ghcr.io/${{ github.repository_owner }}/linker-api:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/linker-web:latest
            ghcr.io/${{ github.repository_owner }}/linker-web:${{ github.sha }}
