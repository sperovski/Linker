# Fly.io config for the API.  Deploy:  fly deploy -c fly.api.toml
# One-time setup is documented in README.md (Deploy section).
app = "linker-api"
primary_region = "fra"

[build]
  dockerfile = "Linker.Api/Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  Database__MigrateOnStartup = "true"
  Database__SeedDemoData = "true"
  Jwt__Issuer = "Linker.Api"
  Jwt__Audience = "Linker.Client"
  # fdaa::/16 is Fly's documented private 6PN range — the app is only ever
  # reached over this network (by fly-proxy), never directly from the public
  # internet, so it's safe to trust forwarded headers from it.
  RateLimiting__TrustedProxies__0 = "fdaa::/16"
  # Secrets (set via `fly secrets set -c fly.api.toml`):
  #   ConnectionStrings__DefaultConnection, Jwt__Key,
  #   Seed__AdminEmail, Seed__AdminPassword,
  #   App__BaseUrl (public web URL, used in emailed links),
  #   optionally Anthropic__ApiKey and Smtp__* for real email.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# TODO before relying on uploaded CVs in production: student-uploaded CV files
# are written to /app/uploads, which is ephemeral on Fly without a volume.
# Provision one and mount it before going live:
#   fly volumes create linker_uploads --size 1 -c fly.api.toml
